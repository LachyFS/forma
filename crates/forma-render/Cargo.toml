[package]
name = "forma-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forma-core = { path = "../forma-core" }
anyhow.workspace = true
glam.workspace = true
bytemuck.workspace = true
image.workspace = true
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"
libloading = "0.8"

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
core-video = { version = "0.4.3", features = ["metal"] }
core-foundation = "0.10"
foreign-types = "0.5"
objc = "0.2"
