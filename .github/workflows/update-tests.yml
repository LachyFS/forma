name: Update installation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Installed upgrade (${{ matrix.platform }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: update-${{ matrix.platform }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Install update packager
        run: dotnet tool install --global vpk --version 1.3.39-g8d2844f
      - name: Linux AppImage packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools libfuse2
      - name: Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"$env:ProgramFiles\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew list --versions openssl@3 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test authenticated metadata and restart decisions
        run: cargo test --locked -p forma-update
      - name: Upgrade and restart an installed application and companion library
        run: python scripts/test-update-install.py ${{ matrix.platform }}
      - name: Upgrade between complete preview versions
        run: python scripts/test-update-install.py ${{ matrix.platform }} --preview
