name: Platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified AI denoiser runtime
        run: python scripts/setup-denoiser.py
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev libzstd-dev libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile every target
        run: cargo check --locked --workspace --all-targets
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Core and application unit tests
        run: cargo test --locked -p forma-core -p forma
      - name: Validate WGSL and generate Vulkan, Metal, and DirectX shaders
        run: cargo test --locked -p forma-render --test shaders
      - name: Execute AI denoiser on CPU or available GPU
        run: cargo test --locked -p forma-render --test denoise_runtime -- --ignored --test-threads=1
      - name: Execute shared renderer tests on Vulkan
        if: runner.os == 'Linux'
        env:
          FORMA_RENDERER: vulkan
          XDG_RUNTIME_DIR: /tmp/forma-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test --locked -p forma-render -- --test-threads=1

# Metal/DX12 runtime parity requires machines exposing those GPU APIs. Hosted
# runners still compile their complete native application and shader backends;
# hardware execution is tracked separately in docs/PLATFORMS.md.
