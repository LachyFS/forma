[workspace]
members = ["crates/forma-core", "crates/forma-render", "crates/forma-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

# `package."*"` covers dependencies only. Geometry and rendering run per pointer
# event, where an unoptimized build costs tens of milliseconds a frame and makes
# interactive transforms lag. These two crates change less often than the UI,
# which stays unoptimized so its rebuilds remain quick.
[profile.dev.package.forma-core]
opt-level = 2

[profile.dev.package.forma-render]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
